[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-review-system"
version = "1.0.0"
description = "Multi-Agent Review System for Academic Papers"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "MARS Contributors"},
]
keywords = ["academic", "papers", "review", "ai", "multi-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]

dependencies = [
    "PyPDF2>=3.0.1",
    "beautifulsoup4>=4.13.0",
    "requests>=2.32.0",
    "transformers>=4.48.0",
    "torch>=2.6.0",
    "ollama>=0.4.7",
    "pandas>=2.2.0",
    "numpy>=2.2.0",
    "nltk>=3.9.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "PyYAML>=6.0.0",
    "pydantic>=2.10.0",
    "tqdm>=4.67.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.0.0",
]
notebook = [
    "jupyter>=1.1.0",
    "ipython>=9.0.0",
]

[project.urls]
Homepage = "https://github.com/kunpai/MARS"
Repository = "https://github.com/kunpai/MARS"
Issues = "https://github.com/kunpai/MARS/issues"

[project.scripts]
mars = "MARS:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["util*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
target-version = "py39"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "ollama.*",
    "PyPDF2.*",
    "vaderSentiment.*",
    "bs4.*",
]
ignore_missing_imports = true