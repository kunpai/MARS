[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mars-paper-review"
version = "1.0.0"
description = "Multi-Agent Review System for Academic Papers"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "MARS Team"},
]
keywords = ["ai", "paper-review", "multi-agent", "nlp", "academic"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "annotated-types>=0.7.0",
    "anyio>=4.8.0",
    "arxiv>=2.1.3",
    "beautifulsoup4>=4.13.3",
    "click>=8.1.0",
    "httpx>=0.28.0",
    "huggingface-hub>=0.28.0",
    "jinja2>=3.1.0",
    "nltk>=3.9.0",
    "numpy>=1.24.0",
    "ollama>=0.5.0",
    "pandas>=2.0.0",
    "pydantic>=2.10.0",
    "pypdf>=4.0.0",  # Modern replacement for PyPDF2
    "python-dateutil>=2.9.0",
    "pyyaml>=6.0.0",
    "requests>=2.32.0",
    "textblob>=0.19.0",
    "tokenizers>=0.21.0",
    "torch>=2.0.0",
    "transformers>=4.48.0",
    "typing-extensions>=4.12.0",
    "rich>=13.0.0",  # For better CLI experience
    "loguru>=0.7.0",  # Modern logging
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pre-commit>=3.6.0",
    "ruff>=0.2.0",
]

[project.scripts]
mars = "mars.cli:main"

[project.urls]
Homepage = "https://github.com/kunpai/MARS"
Repository = "https://github.com/kunpai/MARS"
Issues = "https://github.com/kunpai/MARS/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mars*", "util*"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.ruff]
line-length = 88
target-version = "py310"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--cov=mars",
    "--cov=util",
    "--cov-report=term-missing",
    "--cov-report=html",
]